[VORLAGE]
EASTRON_HINWEIS = "Setzt <b>nur den Netzzähler</b> auf Register 52, Funktionscode 4, als 32-Bit-Fließkommazahl. Belegt aus der Loxone-Vorlage <span class='sm-mono'>MB_Eastron SDM630-TCP.xml</span>, Kanal „027 – Total system power“: dort steht Register 52 mit Funktionscode 4, und weil Loxone zur Anzeige in kW durch 1000 teilt, liefert das Register <b>Watt</b>. <b>Bitte nachmessen:</b> ob der Zähler das Vorzeichen führt, steht in der Vorlage nicht. Hängt er hinter einem Gateway, ist die Geräteadresse oft nicht 1 — der Reiter <i>Test</i> sagt Ihnen, was ankommt."
EASTRON = "Eastron SDM630, über Modbus TCP"
ANGEWENDET_ERSATZ = "Der Netzzähler der Vorlage wurde auf den <b>Ersatzzähler</b> gelegt. Alle übrigen Felder blieben unberührt. Bitte durchsehen und dann speichern."
OHNE_NETZ = "Diese Vorlage enthält keinen Netzzähler — sie lässt sich nicht auf den Ersatzzähler anwenden. Es wurde nichts geändert."
Z_ERSATZ = "nur den Netzzähler (Ersatz)"
Z_VORLAGE = "die Felder, die die Vorlage vorsieht"
ZIEL = "anwenden auf"
HAND = "Von Hand eintragen"
HAND_HINWEIS = "Es wird nichts vorbelegt. Alle Felder bleiben, wie sie sind."
SMARTMETER = "Smartmeter Classic (LoxBerry-Plugin), über MQTT"
SMARTMETER_HINWEIS = "Setzt <b>nur den Netzzähler</b> auf <span class='sm-mono'>&lt;Präfix&gt;/Total_Power_OBIS_16.7.0</span> — das ist die momentane Summenwirkleistung. <b>Bitte nachmessen:</b> ob dieser Zähler das Vorzeichen führt, ist nicht belegt. Sehen Sie tagsüber bei Sonne im Reiter <i>Test</i> unter „Messwerte lesen“ nach: steht dort bei Einspeisung eine <b>negative</b> Zahl, ist alles richtig. Bleibt sie bei 0 oder positiv, führt Ihr Zähler Bezug und Lieferung getrennt — dann taugt dieses Thema nicht."
FRONIUS = "Fronius Symo Hybrid (Solar API), über HTTP"
FRONIUS_HINWEIS = "Setzt <b>alle vier</b> Messquellen auf <span class='sm-mono'>/solar_api/v1/GetPowerFlowRealtimeData.fcgi</span>. Gemessen an einem Symo Hybrid am 19.08.2026: <span class='sm-mono'>P_Grid</span> folgt bereits der Hausregel (plus = Bezug) und wird nicht umgedreht; <span class='sm-mono'>P_Akku</span> ist beim <i>Entladen</i> positiv und wird deshalb umgedreht. Der Ladestand kommt von Wechselrichter 1. Haben Sie mehrere Speicher, gilt das für den, den die Solar API führt."
FRONIUS_MODBUS = "Fronius Symo Hybrid, über Modbus TCP (gemessen)"
FRONIUS_MODBUS_HINWEIS = "Setzt <b>Netz, Erzeugung und Ladestand</b> auf Modbus TCP und nur die <b>Ladeleistung</b> auf die Solar API — SunSpec führt in Modell 124 kein Register für die Lade- oder Entladeleistung. Alle Adressen wurden am 19.08.2026 an einem Symo Hybrid <b>gemessen</b>. Der <b>Zähler</b> hat die Geräteadresse <span class='sm-mono'>240</span>, nicht 1: er hängt am Datamanager und wird über dessen Gateway erreicht; sein Vorzeichen stimmt mit <span class='sm-mono'>P_Grid</span> überein (plus = Bezug) und wird <i>nicht</i> umgedreht. <b>Wichtig zur „Erzeugung“:</b> Register 40091 ist die <b>Ausgangsleistung des Wechselrichters</b>, nicht die PV-Erzeugung — beim Hybrid steckt die Entladung des Speichers mit darin. Nachts zeigt das mehrere hundert Watt, obwohl die Sonne weg ist; das ist kein Fehler, sondern der Speicher. Für dieses Plugin ist es dennoch der richtige Wert, weil die berechnete Grenze über <span class='sm-mono'>WMaxLimPct</span> auf genau diese Ausgangsleistung wirkt. Wer stattdessen die reine PV-Leistung sehen will, nimmt die Vorlage über die Solar API. <b>Achtung:</b> Die Adressen gelten für die Einstellung „float“ (Modell 113); bei „int+SF“ verschiebt sich alles um zehn Register. Prüfen Sie nach dem Übernehmen im Reiter Test. <b>Zwei Wechselrichter?</b> Wenden Sie danach zusätzlich die Vorlage „Fronius, zweiter Wechselrichter“ an — sie setzt nur <span class='sm-mono'>Erzeugung 2</span>, und beide Erzeugungen werden addiert."
FRONIUS_MODBUS_ZWEITER = "Fronius, zweiter Wechselrichter (nur Erzeugung 2)"
FRONIUS_MODBUS_ZWEITER_HINWEIS = "Für eine <b>zweite</b> PV-Anlage. Setzt <i>nur</i> die Quelle <b>Erzeugung 2</b> — alles andere bleibt unberührt. Wenden Sie zuerst die Vorlage für den ersten Wechselrichter an, dann diese. Beide Erzeugungen werden <b>addiert</b>. <b>Warum hier nicht nur die IP gefragt wird:</b> beim zweiten Gerät unterscheiden sich <i>zwei</i> Dinge — die Adresse des Datamanagers <b>und</b> die Geräteadresse dahinter. Am 19.08.2026 gemessen: der Hybrid liegt auf <span class='sm-mono'>192.168.178.31</span> unter <span class='sm-mono'>1</span>, der Symo 8.2 auf <span class='sm-mono'>192.168.178.30</span> unter <span class='sm-mono'>2</span>. Geraten wird hier nichts. <b>Die Geräteadresse finden Sie so:</b> antwortet der Datamanager mit <i>Modbus-Ausnahme 11</i>, ist der Port richtig und die Geräteadresse falsch — probieren Sie 1 bis 10 durch. <b>Achtung:</b> Register 40091 ist die Ausgangsleistung des Wechselrichters, nicht die PV-Leistung; bei einem zweiten Hybrid steckt dort ebenfalls der Speicher mit drin. Und wenn <b>eine</b> der beiden Erzeugungsquellen ausfällt, gilt die ganze Erzeugung als unbekannt — eine Teilsumme wäre zu klein und würde zu scharf abregeln. <b>Ein dritter Wechselrichter?</b> Dafür gibt es das Feld <span class='sm-mono'>Erzeugung 3</span> — dort von Hand eintragen, nach demselben Muster <span class='sm-mono'>IP:Port/Geräteadresse/40091/float32/3</span>. Zeigen zwei Felder auf dasselbe Gerät, sagt es die Mängelliste: das zählte einen Wechselrichter doppelt."
F_IP = "IP-Adresse des Wechselrichters"
F_PRAEFIX = "Themen-Präfix des Zählers"
F_GERAET = "Host:Port/Geräteadresse des zweiten Wechselrichters"
