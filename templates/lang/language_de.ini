[LOX]
ADRESSE_IP_UNBEKANNT = "die Netzadresse des LoxBerry"
ADRESSE_IP = "die Adresse <span class='sm-mono'>%s</span>"
ADRESSE_WARNUNG = "<b>Achtung:</b> Sie haben diese Seite unter <span class='sm-mono'>%1$s</span> geöffnet. Genau dieser Name steht in der Vorlage — und im Miniserver zeigt er auf <i>den Miniserver selbst</i>, nicht auf den LoxBerry. Tragen Sie in Loxone Config stattdessen %2$s ein, oder rufen Sie diese Seite unter der Netzadresse des LoxBerry auf und laden Sie die Vorlage neu."
Z_STUFE = "Zielstufe wählen (0, 1 oder 2)"
H_SCHRITTE = "Schritt für Schritt"
S1 = "<b>1. Weg festlegen.</b> Die Werte holt der Miniserver &uuml;ber die Adresse unten ab &mdash; das ist der Regelweg dieses Plugins und braucht kein MQTT. Wer die Werte zus&auml;tzlich im Broker haben will, findet die Themen im Reiter <i>MQTT</i>; dort steht auch das Abo, ohne das am Miniserver nichts ankommt."
S2 = "<b>2. Adresse pr&uuml;fen.</b> Die Adresse in der Vorlage entsteht aus dem Namen, unter dem Sie <i>gerade diese Seite</i> aufgerufen haben. &Ouml;ffnen Sie die Oberfl&auml;che &uuml;ber <span class='sm-mono'>localhost</span>, steht dort localhost &mdash; und das zeigt im Miniserver auf ihn selbst. Pr&uuml;fen Sie die Adresse, bevor Sie die Vorlage einlesen; im Zweifel die IP-Adresse des LoxBerry eintragen."
S3 = "<b>3. Virtuelle Eing&auml;nge anlegen.</b> Vorlage herunterladen und in Loxone Config unter <b>Virtuelle Eing&auml;nge &rarr; Vorlage einlesen</b> einspielen. <b>Achtung:</b> Loxone Config legt beim Import <b>neu an und &uuml;berschreibt nichts</b>. Zweimal eingelesen hei&szlig;t doppelte Objekte &mdash; die alten vorher l&ouml;schen."
S4 = "<b>4. Befehle senden.</b> Ein virtueller Ausgang mit den beiden Adressen aus der Tabelle oben schaltet die Regelung ein und aus. Mehr geht bewusst nicht: der Schalter gibt die Anlage frei, er drosselt sie nicht."
S5 = "<b>5. Ausfallerkennung.</b> Virtuelle Eing&auml;nge behalten ihren letzten Wert &mdash; f&auml;llt der LoxBerry aus, sieht in der App alles normal aus. Deshalb liefert das Plugin zwei Alterswerte: <span class='sm-mono'>EB_ALTER</span> f&uuml;r den Durchlauf des Dienstes und <span class='sm-mono'>EB_MESSALTER</span> f&uuml;r den Z&auml;hlerwert. Beide steigen, wenn nichts mehr kommt."
S6 = "<b>6. Bausteine nachbauen.</b> Die Tabelle unten von oben nach unten abarbeiten. Loxone Config f&uuml;hrt die Bausteine in der Baustein-Suche (F5)."
S7 = "<b>7. Gegenprobe.</b> Regelung in der Oberfl&auml;che einschalten und in Loxone Config die Live-Ansicht &ouml;ffnen: <span class='sm-mono'>EB_EIN</span> muss auf 1 springen und <span class='sm-mono'>EB_ALTER</span> im Pr&uuml;ftakt zur&uuml;ckfallen. Bleibt ein Wert stehen, stimmt die Adresse nicht &mdash; nicht der Baustein."
H_BAUSTEINE = "Die Bausteine, einer je Zeile"
BAUSTEINE = "<table class='sm-tbl'><tr><th>#</th><th>Baustein (Typ)</th><th>Name (Vorschlag)</th><th>Parameter</th><th>Eing&auml;nge verbinden mit</th></tr><tr><td>1</td><td>Merker</td><td>Bremse l&auml;uft</td><td>&mdash;</td><td><span class='sm-mono'>EB_EIN</span></td></tr><tr><td>2</td><td>Formel</td><td>Einspeisung</td><td><span class='sm-mono'>-min(0;I1)</span></td><td><span class='sm-mono'>EB_NETZ</span></td></tr><tr><td>3</td><td>Analogwert-Vergleicher</td><td>Auflage verletzt</td><td>Schwelle = erlaubte Einspeisung + 200 W, Einschaltverz&ouml;gerung 120 s</td><td>#2</td></tr><tr><td>4</td><td>Merker</td><td>Notbetrieb</td><td>&mdash;</td><td><span class='sm-mono'>EB_NOTFALL</span></td></tr><tr><td>5</td><td>Analogwert-Vergleicher</td><td>Keine Wirkung</td><td>kleiner als 0</td><td><span class='sm-mono'>EB_WIRKUNG</span></td></tr><tr><td>6</td><td>Analogwert-Vergleicher</td><td>Z&auml;hler ausgefallen</td><td>gr&ouml;&szlig;er als dreimal der Pr&uuml;ftakt</td><td><span class='sm-mono'>EB_MESSALTER</span></td></tr><tr><td>7</td><td>Analogwert-Vergleicher</td><td>Dienst steht</td><td>gr&ouml;&szlig;er als 120 s</td><td><span class='sm-mono'>EB_ALTER</span></td></tr><tr><td>8</td><td>ODER</td><td>Sammelst&ouml;rung Einspeisebremse</td><td>&mdash;</td><td>#3, #4, #5, #6, #7</td></tr><tr><td>9</td><td>Benachrichtigungsbaustein</td><td>Meldung Einspeisebremse</td><td>Betreff und Text frei</td><td>#8 &mdash; und <b>nur</b> #8</td></tr><tr><td>10</td><td>Virtueller Ausgang</td><td>Bremse schalten</td><td>Adresse siehe oben, Befehl bei EIN und bei AUS</td><td>ein Schalter oder eine Bedingung</td></tr><tr><td>11</td><td>Statistik (optional)</td><td>Gestellte Grenze</td><td>&mdash;</td><td><span class='sm-mono'>EB_GESTELLT</span></td></tr></table>"
BAUSTEINE_ERL = "<b>Zu #3:</b> Die Einschaltverz&ouml;gerung ist kein Feinschliff. Ohne sie meldet jede Wolkenl&uuml;cke eine Auflagenverletzung, und nach der dritten Meldung sieht niemand mehr hin. <b>Zu #6 und #7:</b> Die Schwellen deutlich &uuml;ber den Abholtakt legen, sonst l&ouml;st ein einzelner verpasster Durchlauf aus. <b>Zu #9:</b> Der Benachrichtigungsbaustein sendet nur beim Wechsel von Aus auf Ein. Niemals mehrere Quellen direkt an seinen Eingang h&auml;ngen &mdash; erst &uuml;ber das ODER zusammenf&uuml;hren, sonst verschluckt eine dauerhaft anstehende Quelle alle &uuml;brigen."
