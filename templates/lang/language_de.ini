SICH_GANZE_DATEI = "die ganze Datei"
L_SPEICHER_EXTERN = "Speicher extern geführt (Loxone)"
H_SPEICHER_EXTERN = "Ab Werk aus. Eingeschaltet führt <b>Loxone</b> die Speicher und meldet über das Haus-Thema <span class='sm-mono'>haus/energie/aufnahme_w</span> (mit <span class='sm-mono'>haus/energie/aufnahme_ts</span>), wie viel sie gerade noch aufnehmen. Geht zu viel hinaus, wartet die Bremse bis zur „Wartezeit für Loxone“, ob die Einspeisung fällt, und regelt erst dann ab — abgewartet wird nur der Teil, den Loxone als Aufnahme meldet. Sie stellt selbst <b>keinen</b> Speicher; „Erst den Speicher füllen“ und der eigene Speicherweg ruhen. Kommt kein frischer Wert (älter als das Höchstalter der Nebenwerte), regelt sie wie ohne diese Betriebsart und sagt es im Reiter <i>Test</i> und im Protokoll. Was Loxone dafür liefern muss: Reiter <i>Einbindung in Loxone</i>."
L_EXTERN_WIRKUNG_S = "Wartezeit für Loxone (s)"
SICH_NEUE_BEHALTEN = "Die Sicherung stammt aus einer Fassung ohne diese Einstellungen: %s. Sie behalten ihren laufenden Wert."
L_STELLER_VON = "Kennung an Stellglieder anhängen, die ein LoxBerry-Plugin ansprechen"
H_STELLER_VON = "Ab Werk aus. Eingeschaltet hängt die Bremse <span class='sm-mono'>&amp;von=einspeisebremse</span> an jedes Stellglied der Art HTTP, dessen Adresse der Endpunkt eines LoxBerry-Plugins ist (<span class='sm-mono'>http://…/plugins/&lt;ordner&gt;/…</span>, etwa AnkerSolix, ZendureSolarFlow, EVCC oder MarstekVenus). Die Schreiber-Wache dort unterscheidet die Bremse dann von Loxone und anderen Schreibern. An die Adresse eines Geräts (Wechselrichter, Modbus, SunSpec, MQTT) wird nie etwas angehängt, eine Adresse mit eigenem <span class='sm-mono'>von=</span> bleibt, wie sie ist. Der Speicherweg trägt die Kennung immer. Vor dem Einschalten im Reiter <i>Test</i> nachsehen, welche Stellglieder sie bekommen; ein Plugin ohne Schreiber-Wache übergeht den Zusatz nicht unbedingt."
WAS_IST_DAS = "<b>Null- oder begrenzte Einspeisung für mehrere Wechselrichter und Hybrid-Speicher.</b> Ein Dienst liest den Netzzähler (über MQTT, HTTP oder Modbus TCP), rechnet den Überschuss aus, lässt erst den Speicher laden und gibt nur den Rest als Grenze an die Wechselrichter weiter – über MQTT, HTTP oder Modbus TCP/SunSpec. Ob die Einspeisung danach wirklich fällt, prüft er am Zähler nach. Die Werte holt der Miniserver über eine Adresse auf dem LoxBerry ab, auf Wunsch gehen sie auch über das MQTT-Gateway; aus Loxone lässt sich die Regelung nur ein- und ausschalten."

