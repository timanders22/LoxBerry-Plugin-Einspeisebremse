[LOX]
ADRESSE_IP_UNBEKANNT = "die Netzadresse des LoxBerry"
ADRESSE_IP = "die Adresse <span class='sm-mono'>%s</span>"
ADRESSE_WARNUNG = "<b>Achtung:</b> Sie haben diese Seite unter <span class='sm-mono'>%1$s</span> geöffnet. Genau dieser Name steht in der Vorlage — und im Miniserver zeigt er auf <i>den Miniserver selbst</i>, nicht auf den LoxBerry. Tragen Sie in Loxone Config stattdessen %2$s ein, oder rufen Sie diese Seite unter der Netzadresse des LoxBerry auf und laden Sie die Vorlage neu."
Z_STUFE = "Zielstufe wählen (0, 1 oder 2)"
H_SCHRITTE = "Schritt für Schritt"
S2 = "<b>Adresse prüfen.</b> Die Adresse in der Vorlage entsteht aus dem Namen, unter dem Sie <i>gerade diese Seite</i> aufgerufen haben. Öffnen Sie die Oberfläche über <span class='sm-mono'>localhost</span>, steht dort localhost — und das zeigt im Miniserver auf ihn selbst. Prüfen Sie die Adresse, bevor Sie die Vorlage einlesen; im Zweifel die IP-Adresse des LoxBerry eintragen."
S3 = "<b>Virtuelle Eingänge anlegen.</b> Vorlage herunterladen und in Loxone Config unter <b>Virtuelle Eingänge → Vorlage einlesen</b> einspielen. <b>Achtung:</b> Loxone Config legt beim Import <b>neu an und überschreibt nichts</b>. Zweimal eingelesen heißt doppelte Objekte — die alten vorher löschen."
S4 = "<b>Befehle senden.</b> Die Steuervorlage (Knopf unten) legt einen virtuellen Ausgang mit drei Befehlen an: Regelung einschalten, Regelung ausschalten und Zielstufe wählen. Mehr geht bewusst nicht: Ausschalten gibt die Anlage frei, und eine Stufe wählt nur einen der drei Werte, die Sie im Reiter <i>Einstellungen</i> eingetragen haben — einen Wattwert nimmt das Plugin von außen nicht an."
S5 = "<b>Ausfallerkennung.</b> Virtuelle Eingänge behalten ihren letzten Wert — fällt der LoxBerry aus, sieht in der App alles normal aus. Deshalb zählt das Plugin mit <span class='sm-mono'>EB_ZAEHLER</span> je Durchlauf eins weiter (0–999). Die Liste unten legt ihn an eine Analogwertvalidierung (Konstante 1 an En); steht der Zähler länger als Tmc, meldet ihr Ausgang E. Zum Ablesen gibt es dazu <span class='sm-mono'>EB_ALTER</span> (Alter des Durchlaufs) und <span class='sm-mono'>EB_MESSALTER</span> (Alter des Zählerwerts)."
S6 = "<b>6. Bausteine nachbauen.</b> Die beiden Seiten unten von oben nach unten abarbeiten, jede mit eigener Anleitung; die zweite nur mit „Speicher extern geführt“. Loxone Config führt die Bausteine in der Baustein-Suche (F5)."
S7 = "<b>Gegenprobe.</b> Regelung in der Oberfläche einschalten und in Loxone Config die Live-Ansicht öffnen: <span class='sm-mono'>EB_EIN</span> muss auf 1 springen und <span class='sm-mono'>EB_ALTER</span> im Prüftakt zurückfallen. Bleibt ein Wert stehen, stimmt die Adresse nicht — nicht der Baustein."
H_BAUSTEINE = "Die Bausteine, einer je Zeile"
H_VORLAGE = "Vorlage für den Miniserver"
ERKLAERUNG = "Die Vorlage bringt achtzehn Summenwerte mit und je Stellglied zwei weitere. In Loxone Config unter <b>Virtuelle Eingänge → Vorlage einlesen</b> einspielen. Die Adresse steckt bereits in der Datei; ändert sich das Wortzeichen, muss die Vorlage neu geladen werden."
FEHLER_VORLAGE = "Die Vorlage konnte nicht erzeugt werden."
K_VI = "Vorlage herunterladen"
K_TOKEN_NEU = "Neues Wortzeichen"
TOKEN_NEU_OK = "Es gilt ein neues Wortzeichen. Bitte die Vorlage neu herunterladen und in Loxone Config einlesen — die alte Adresse antwortet nicht mehr."
H_ADRESSE = "Adressen"
ADRESSE_HILFE = "Diese Adressen antworten ohne Anmeldung, aber nur mit dem richtigen Wortzeichen. Sie geben Auskunft, und sie können die Regelung <b>ein- oder ausschalten</b> und eine der drei eingetragenen <b>Zielstufen</b> wählen — mehr nicht. Einen Sollwert von außen gibt es bewusst nicht: wer die Grenze übers Netz setzen könnte, könnte die Anlage übers Netz abschalten, geschützt nur durch ein Wortzeichen, das offen in der Adresse steht. Der Schalter dagegen ist nützlich und in der schlimmsten Denkbarkeit harmlos: er gibt die Anlage frei, er drosselt sie nicht."
