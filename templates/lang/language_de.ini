[STELL]
STILL_HILFE = "Ein stillgelegtes Stellglied behält seine Einstellung, bekommt aber nichts mehr gestellt und taucht in Loxone nicht mehr auf. Achtung: es bleibt auf der zuletzt gestellten Grenze stehen — vor dem Stilllegen also die Regelung kurz ausschalten, damit es freigegeben wird."
SUNSPEC_HILFE = "<b>Modbus TCP / SunSpec:</b> Dieser Weg braucht <i>keinen</i> Platzhalter — er rechnet die Prozentzahl selbst aus der Grenze und der <b>Spitzenleistung</b>, die deshalb eingetragen sein muss. Adresse: <span class='sm-mono'>IP[:Port]/Geräteadresse[/Basis[/Rückfall_s]]</span>, üblich <span class='sm-mono'>192.0.2.31:502/1/40000/120</span>. <b>Basis</b> ist das Register mit der Marke <span class='sm-mono'>SunS</span> (beim Fronius Datamanager 40000); von dort wird die Modellkette abgeschritten, bis Modell 123 erscheint — es liegt <i>nicht</i> an einer festen Adresse. <b>Rückfall</b> ist der Zeitablauf in Sekunden, den der Wechselrichter selbst führt: danach nimmt er die Drosselung von allein zurück, falls die Bremse schweigt. Das Plugin frischt vorher auf. Zwei Dinge müssen im Fronius-Webinterface stimmen, sonst quittiert das Gerät freundlich und tut nichts: <i>Wechselrichter-Steuerung über Modbus</i> muss eingeschaltet sein, und wenn <i>Steuerung einschränken</i> aktiv ist, muss die IP des LoxBerry dort stehen. Ob wirklich gedrosselt wird, sagt danach allein die Wirkungsprüfung am Zähler."
L_STILL = "stillgelegt"
STELLER = "Stellglied"
L_NAME = "Name"
L_ART = "Weg"
