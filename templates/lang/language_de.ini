HILFE = "<b>Art:</b> „MQTT“ hört auf ein Thema, „HTTP“ ruft eine Adresse ab. <b>Pfad im JSON:</b> leer lassen, wenn die Nachricht nur eine Zahl enthält; sonst der Weg zum Wert, etwa <span class='sm-mono'>data.power</span> oder <span class='sm-mono'>emeters.0.power</span>. <b>Faktor:</b> für Zähler, die in kW liefern — dann 1000. <b>Umdrehen:</b> Im ganzen Plugin gilt <b>plus = Bezug, minus = Einspeisung</b>. Zeigt Ihr Zähler es andersherum, setzen Sie hier den Haken; das ist der häufigste Grund, warum eine Bremse genau falschherum regelt. <b>Erzeugung 2</b> ist für eine zweite PV-Anlage: sie wird zur ersten <b>addiert</b> (der Ersatzzähler ersetzt, diese Quelle addiert). <b>Achtung:</b> fällt einer der beiden eingetragenen Werte aus, gilt die ganze Erzeugung als unbekannt — eine Teilsumme wäre zu klein und würde die Anlage zu scharf abregeln."

