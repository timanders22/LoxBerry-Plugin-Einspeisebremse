SUNSPEC_UNTER_ZEHN = "Die Untergrenze der Drosselung liegt unter zehn Prozent der Nennleistung eines SunSpec-Stellglieds. <b>Am 19.08.2026 gemessen</b> (Fronius Symo 8.2-3-M, Software 0.3.30.2): bis hinunter zu 0,09 % trat <i>kein</i> erzwungener Standby ein — das Gerät drosselte sauber und nahm die Betriebsart nach dem Zeitablauf selbst zurück. Die Warnung des Handbuchs gilt also nicht für jede Software-Fassung. Zwei Gründe bleiben trotzdem: das Handbuch nennt die Standby-Gefahr ausdrücklich <i>softwareabhängig</i>, Ihr Gerät kann eine andere Fassung haben; und unterhalb von etwa einem halben Prozent der Nennleistung folgt das Gerät der Vorgabe ohnehin nicht mehr (gemessen: Vorgabe 7 W, gehalten 39 W). Eine Untergrenze darunter ist also wirkungslos, nicht scharf."
SUNSPEC_NOTWERT_ZU_TIEF = "Der Notwert liegt unter zehn Prozent der Nennleistung eines SunSpec-Stellglieds. <b>Der Notbetrieb geht an der Untergrenze vorbei</b> — fällt der Zähler aus, wird genau dieser Wert gestellt, nicht die Untergrenze. Der Hauptgrund ist nicht der Standby (der trat am 19.08.2026 bis 0,09 % herunter <i>nicht</i> ein), sondern die Wirkung am Zähler: auf einem Hybrid holt das Haus jedes Watt, das der Wechselrichter nicht mehr abgeben darf, aus dem Netz. Gemessen: 77 W Drosselung ergaben 78 W Netzbezug. Ein Notwert von 0 schiebt bei einem Zählerausfall den <b>ganzen</b> Hausverbrauch ins Netz — und zwar so lange, bis jemand es bemerkt. Wer lieber gar nicht einspeist als unkontrolliert, darf das so einstellen — nur nicht versehentlich."
