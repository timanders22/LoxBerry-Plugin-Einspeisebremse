M_T_MUSTER = "im Musterprojekt"
M_ART_ZAHL = "Zahl"
M_ART_TEXT = "Text"
M_S3_KURZ = "Eingänge anlegen"
M_S3 = "<b>3. Eingänge anlegen.</b> Je Wert ein <b>Virtueller Eingang</b> (für Text ein <b>Virtueller Texteingang</b>), Name genau wie in der Tabelle – unter diesem Namen liefert das MQTT-Gateway. Eine Vorlage für Werte gibt es nicht: die Namen reichen."
M_S3_DIGITAL = "„Als Digitaleingang verwenden“ nicht anhaken – alle Werte sind analog, auch die 0/1-Werte."
M_S3_RECHTE = "Der LoxBerry-Benutzer am Miniserver braucht Rechte auf diese Eingänge."
M_S3_MUSTER = "Wer die Seiten aus dem Musterprojekt kopiert, bekommt die Eingänge mit."
M_S3_PRAEFIX = "Präfix im Reiter <i>MQTT</i> geändert? Dann ändern sich alle Namen."
M_S3_NETZ = "netz und ueberschuss werden ohne Zählerwert nicht gesendet – −1 W wäre ein echter Messwert; Loxone hält dann den letzten Wert, und status_ok = 0 sagt es. erzeugung, gestellt und messalter senden −1, wenn kein Wert vorliegt."
M_KOPIEREN = "kopieren"
M_KOPIERT = "kopiert"
M_S4 = "<b>4. Ausfallerkennung.</b> Analogwertvalidierung an %1$s: Tmc 180 s (das Lebenszeichen kommt alle 30 s, nie retained, direkt an den Broker), Min 0, Max 999, Konstante 1 an En und im Eigenschaftsfenster den Haken bei ‚En‘ entfernen. %2$s sagt, ob der letzte Durchlauf einen Zählerwert hatte. Kein Alter in Sekunden aus einem Zeitstempel rechnen – Loxone rechnet in Ortszeit."
M_S5 = "<b>5. Befehle.</b> Regelung ein, Regelung aus und Zielstufe gehen über die Befehlsbrücke: Loxone sendet an den UDP-Eingang des MQTT-Gateways, das Plugin prüft und führt aus wie über den Endpunkt – mit sperrenden Mängeln abgelehnt, nur Stufe 0, 1 oder 2, nie ein Wattwert. Im Reiter <i>MQTT</i> beide Haken setzen: „Befehle über MQTT annehmen“ und „Bremse über MQTT steuern“ – ab Werk aus."
