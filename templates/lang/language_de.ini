SPEICHER_OHNE_MESSUNG = "Erst den Speicher füllen ist eingeschaltet, aber es ist keine Quelle für die Ladeleistung eingetragen. Dann lässt sich nicht feststellen, ob der Speicher den Überschuss wirklich aufnimmt — bis 0.9.4 galt er ungeprüft als aufnahmefähig, und die Anlage speiste weiter, während die Anzeige den Überschuss im Speicher meldete."
