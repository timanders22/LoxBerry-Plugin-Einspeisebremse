M_RECONNECT = "Nach einem Neustart des Miniservers holt der zentrale <span class='sm-mono'>reconnect</span> (Musterprojekt, Seite „LoxBerry MQTT-Gateway“) die zwischengespeicherten Werte; ein, stufe und ziel sind ohnehin retained, die übrigen kommen spätestens mit dem vollen Satz alle 300 s."
M_T_THEMA = "Thema"
