MUSTERPROJEKT = "Die ganze Projektdatei mit allen Plugin-Seiten und Vorlagen: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry-Plugins Musterprojekt</a>"
BL_WERTE = "Werte, Meldungen und Steuerung"
BL_SPEICHER = "Speicher extern geführt"
K_VQ = "Steuervorlage herunterladen"
ERKLAERUNG_VQ = "Die <b>Steuervorlage</b> legt einen virtuellen Ausgang mit drei Befehlen an: Regelung einschalten, Regelung ausschalten und Zielstufe wählen (0, 1 oder 2). In Loxone Config unter <b>Virtuelle Ausgänge → Vorlage einlesen</b> einspielen. Adresse und Wortzeichen stecken bereits in der Datei; nach einem neuen Wortzeichen auch sie neu laden."
M_S1 = "<b>1. MQTT einschalten.</b> MQTT ist der Weg des LoxBerry-Plugins Musterprojekts: die Bremse sendet ihre Werte an den Broker, das MQTT-Gateway von LoxBerry gibt sie an den Miniserver weiter, und die drei Befehle kommen über die Befehlsbrücke zurück. Ab Werk ist MQTT eingeschaltet (Reiter <i>MQTT</i>, „Werte an MQTT weitergeben“). Der Weg über HTTP bleibt für bestehende Anlagen – unten zugeklappt."
M_S1_AUS = "<b>MQTT ist ausgeschaltet.</b> Ohne den Haken „Werte an MQTT weitergeben“ im Reiter <i>MQTT</i> kommt auf diesem Weg nichts an, und die Befehlsbrücke nimmt nichts an."
M_S2 = "<b>2. Das MQTT-Gateway.</b> Die Themengruppe dieses Plugins:"
