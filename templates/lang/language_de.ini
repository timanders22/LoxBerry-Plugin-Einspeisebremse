SP11_PARAM = "übernimmt die Zeit bei jedem Takt"
SP12_PARAM = "Befehl bei Analogwert: %s"
SP13_PARAM = "Text „Speicher nehmen noch &lt;v1&gt; W auf (Speicher 1 &lt;v2&gt; W, Speicher 2 &lt;v3&gt; W)“"
W_S1 = "Die Eingänge nach der Namenstabelle oben anlegen (Schritt 3 „%s“): je Wert ein Virtueller Eingang, Name genau wie dort, „Als Digitaleingang verwenden“ nicht anhaken. Keine Vorlage – wer diese Seite aus dem Musterprojekt kopiert, bekommt die Eingänge mit."
W_S2 = "Die drei Befehle Nr. 38, 40 und 42 hängen am gemeinsamen Ausgang „%1$s“ (Vorlage aus dem Musterprojekt, Adresse /dev/udp/&lt;LoxBerry-Adresse&gt;/11884) – oder Knopf „%2$s“ (Schritt 5 oben) für einen eigenen Ausgang. Ein Wortzeichen braucht dieser Weg nicht."
W_S3 = "Reiter „%s“: die erlaubte Einspeisung für Stufe 0, 1 und 2 eintragen (ab Werk alle 0 W = Nulleinspeisung)."
W_S4 = "Die Virtuellen Eingänge Nr. 1–5, 16–25 und 28 auf die Seite ziehen. Bei Nr. 17 und 19 in den Eigenschaften „Statistik“ einschalten (Mittelwert genügt)."
W_S5 = "Die Bausteine Nr. 6–14 setzen, dazu drei Status (Nr. 29–31), ein Gleich (Nr. 32), zwei Einschaltverzögerungen (Nr. 33, 34) und ein ODER (Nr. 35). Wer Nr. 1–15 schon gebaut hat, lässt sie, wie sie sind."
W_S6 = "Benachrichtigungen Nr. 15 und Nr. 36 unter Peripherie → Mitteilungen → Benachrichtigung anlegen und auf die Seite ziehen; jede bekommt genau eine Quelle (Nr. 14 bzw. Nr. 35)."
W_S7 = "Zwei Tasten (Nr. 37, 39) und einen Schieberegler (Nr. 41: Min 0, Max 2, Schritt 1, Startwert 0) als Virtuelle Eingänge anlegen, „In Visualisierung verwenden“ an."
W_S8 = "Die drei Befehle aus „%s“ auf die Seite ziehen (Nr. 38, 40, 42) – jeden nur einmal im Projekt."
W_S9 = "Leitungen nach der Spalte „%s“ ziehen. Beim Status Nr. 29 erscheinen die Eingänge V5 und V6 erst nach einem Klick auf das „+“ am Baustein."
W_S10 = "Gegenprobe: im Plugin, Reiter MQTT, die Haken „%1$s“ und „%2$s“ setzen. In der App „Bremse einschalten“ tippen – Nr. 16 springt auf 1 (bleibt sie 0: Reiter Test → „%3$s“, die Quittung steht im Reiter Test). Schieberegler auf 1 – Nr. 24 zeigt 1, Nr. 25 die eingetragene Watt-Zahl. Danach zurück auf 0."
SP_S1 = "Nur nötig, wenn im Reiter „%s“ „%s“ genutzt werden soll: Loxone meldet der Bremse dann, wie viel seine Speicher gerade noch aufnehmen. Neue Seite „Einspeisebremse Speicher“ anlegen."
SP_S2 = "Ausgangsvorlage „LoxBerry MQTT-Gateway“ aus dem Musterprojekt importieren oder von Hand: Virtueller Ausgang, Adresse /dev/udp/&lt;LoxBerry-Adresse&gt;/%d (UDP-Anschluss des MQTT-Gateways, Reiter MQTT); zwei analoge Befehle wie Nr. 8 und 12."
SP_S3 = "Vier Virtuelle Eingänge (analog) anlegen: Nr. 1, 2, 4, 5 (Nr. 1 und 4: Einheit &lt;v&gt; W, Min -30000, Max 30000; Nr. 2 und 5: Einheit &lt;v&gt; %, Min 0, Max 100). Im eigenen Projekt an ihrer Stelle die echten Werte des Speichers anschließen (oder den Virtuellen Eingang durch den Eingang des Speicher-Plugins ersetzen). Nur ein Speicher? Nr. 4–6 löschen, bei Nr. 7 I2 offen lassen."
SP_S4 = "Drei Formeln (Nr. 3, 6, 7) setzen. In Nr. 3 und Nr. 6 die beiden Zahlen an den eigenen Speicher anpassen: höchste Ladeleistung in W (Datenblatt) und Ladeschluss in %."
SP_S5 = "Impulsgeber Nr. 9, Analogspeicher Nr. 11 und Status Nr. 13 setzen. „Unix Timestamp“ (Nr. 10) aus dem Baum unter „Zeitfunktionen“ auf die Seite ziehen."
SP_S6 = "Die Befehle Nr. 8 und 12 aus „LoxBerry MQTT-Gateway“ auf die Seite ziehen – jeden nur einmal im Projekt."
SP_S7 = "Leitungen nach der Spalte „%s“ ziehen, auch vom Ausgang von Nr. 10 an den Eingang V von Nr. 11. Speichern und in den Miniserver laden."
SP_S8 = "Erst jetzt im Plugin den Haken „%s“ setzen. Reiter Test, Selbstprüfung: die Zeile „%s“ muss „ja, … W Aufnahme, … s alt“ zeigen."
H_TAT = "„Tat“ beschreibt nur den letzten Durchlauf: steht die Grenze ruhig, zeigt Nr. 29 „im Gleichgewicht“, obwohl abgeregelt ist. Wie lange abgeregelt war, steht im Plugin unter Test → Bilanz."
H_AUS = "„Bremse ausschalten“ gibt die Anlage frei; „Auflage verletzt“ (Nr. 8) meldet trotzdem weiter, wenn zu viel eingespeist wird."
H_STUFE = "Die Zielstufe wählt nur zwischen den drei im Plugin eingetragenen Werten; einen Wattwert nimmt das Plugin von außen nicht an."
H_SPEICHER = "„Speicher folgt“ ist nur mit einem Speicherweg im Plugin aussagekräftig; ohne ihn steht -1, und Nr. 32 bleibt aus."
SP_H1 = "Vorzeichen: plus = laden. Die Fronius Solar API meldet P_Akku beim Entladen positiv – dort vorher mit einer Formel 0-I1 umdrehen."
SP_H2 = "„Voll“ nur am Ladezustand erkennen: ein voller Speicher meldet -4 bis -13 W, nicht 0."
SP_H3 = "Nie retain: beide Befehle mit publish senden. Das Gateway verliert unter Last 17 bis 70 Prozent der UDP-Pakete; deshalb kommt der Zeitstempel alle 10 s, und frisch ist er bis zum Höchstalter der Nebenwerte (Reiter Einstellungen, Vorgabe 300 s)."
SP_H4 = "Die Seite stellt keinen Speicher. Wer seine Speicher aus Loxone lädt, tut das auf den Seiten des Speicher-Plugins."
SP_H5 = "Prozentangaben heißen in Namen „(Proz)“, weil Config „%“ in „_“ umwandelt."
B38_PARAM = "Befehl bei EIN: %s (nie retain); wirkt nur mit den Haken „Befehle über MQTT annehmen“ und „Bremse über MQTT steuern“ (Reiter MQTT)"
B40_PARAM = "Befehl bei EIN: %s (nie retain); eingreifend (beide Haken)"
B42_PARAM = "Befehl bei Analogwert: %s (nie retain; das Plugin nimmt nur 0, 1 oder 2); eingreifend (beide Haken)"
B_VIMQTT = "Virtueller Eingang (Name wie das MQTT-Gateway ihn vergibt, Plugin %s)"
B_VQMQTT = "Virtueller Ausgang Befehl (Vorlage „%s“, MQTT)"
T_ENTFAELLT = "(entfällt)"
E_V1V2V3_V4E = "V1 = #%d, V2 = #%d, V3 = #%d, V4 = Ausgang E von #%d"

