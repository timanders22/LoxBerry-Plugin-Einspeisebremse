L_ANTEIL = "Anteil"
L_AUFFRISCH_S = "MQTT/HTTP: erneut senden alle (s)"
AUFFRISCH_HILFE = "<b>Erneut senden (MQTT und HTTP):</b> Der Stellbefehl geht nur bei einer Änderung hinaus, über MQTT ohne Retain. Damit ein Gerät, das neu startet oder die Verbindung verliert, seine Grenze nicht erst bei der nächsten Änderung bekommt, sendet die Bremse sie in diesem Abstand erneut — nur solange gedrosselt wird, also der Anteil unter der Spitzenleistung liegt (ohne eingetragene Spitzenleistung: solange die Gesamtgrenze unter dem Freigabewert liegt). Vorgabe 300 s, <b>0 = aus</b>, kürzer als 10 s geht nicht. <b>Achtung Flash-Verschleiß:</b> Manche Adapter und Wechselrichter speichern jede empfangene Grenze dauerhaft; dort den Abstand groß wählen oder 0 setzen und am Gerät eine Rückfallgrenze einstellen. SunSpec-Stellglieder frischt die Bremse über ihren Rückfall in der Adresse auf, nicht über dieses Feld."
L_ADRESSE = "Adresse oder Thema (mit Platzhalter)"
L_INHALT = "Inhalt (mit Platzhalter)"
HILFE = "<b>Platzhalter:</b> <span class='sm-mono'>{W}</span> die Grenze in Watt, <span class='sm-mono'>{KW}</span> dieselbe in Kilowatt mit drei Nachkommastellen, <span class='sm-mono'>{PROZENT}</span> der Anteil an der Spitzenleistung von 0 bis 100. Er darf in der Adresse stehen oder im Inhalt. Beispiele: MQTT-Thema <span class='sm-mono'>wechselrichter/limit/set</span> mit Inhalt <span class='sm-mono'>{W}</span>; oder HTTP-GET <span class='sm-mono'>http://192.0.2.50/api/limit?value={PROZENT}</span>; oder HTTP-POST auf eine Adresse mit Inhalt <span class='sm-mono'>{&quot;limit&quot;:{W}}</span>. <b>Anteil:</b> Bei mehreren Geräten wird die Gesamtgrenze im Verhältnis der Anteile aufgeteilt; stehen überall Nullen, wird gleichmäßig geteilt. <b>Spitzenleistung</b> wird für „Prozent“ gebraucht und begrenzt außerdem, was diesem Gerät zugeteilt wird."
