REGELGROESSEN_HILFE = "<b>Totband:</b> Kleinere Abweichungen bleiben unbeachtet, sonst stellt die Regelung im Sekundentakt nach. <b>Schritt abwärts/aufwärts:</b> Abregeln darf springen — das ist die Richtung, die die Auflage einhält. Freigeben geht in kleinen Schritten, sonst schaukelt sich die Regelung auf: jede Freigabe erzeugt neue Einspeisung, die im nächsten Durchlauf wieder abgeregelt wird. <b>Notfall nach:</b> So lange darf der Zählerwert alt sein, bevor auf den Notwert gefahren wird; mindestens drei Prüftakte. <b>Wirkung prüfen nach:</b> So lange bekommt das Gerät Zeit, bevor am Zähler nachgesehen wird, ob der Befehl überhaupt etwas bewirkt hat."
