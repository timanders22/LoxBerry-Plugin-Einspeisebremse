SPEICHER_STELLER_ERKLAERUNG = "Freiwillig, aber wirksam: ohne einen Weg hierher ist das Ladesoll nur eine Zahl auf dem Bildschirm. Trägt niemand etwas ein, prüft die Regelung an der gemessenen Ladeleistung nach, ob der Speicher den Überschuss überhaupt aufnimmt — und regelt ab, wenn nicht. Dieselben Platzhalter wie bei den Wechselrichtern."
