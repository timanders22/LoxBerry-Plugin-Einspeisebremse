; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der Hilfe.

[HILFE]
K01 = "Einspeisebremse"
K02 = "Hält die Einspeisung ins Netz auf dem Wert, der erlaubt ist — bei einer Nulleinspeisung auf null, bei einer 70-Prozent-Regelung auf 70 Prozent der Modulleistung. Dazu misst sie am Netzzähler, rechnet aus, wie viel zu viel hinausgeht, und gibt eine Grenze an die Wechselrichter weiter. Vorher schiebt sie, was geht, in den Speicher — denn eingelagerter Strom kostet keinen Ertrag, abgeregelter schon."
K03 = "Das Vorzeichen — der häufigste Fehler"
K04 = "Im ganzen Plugin gilt: <b>plus ist Bezug aus dem Netz, minus ist Einspeisung</b>. Jedes Messgerät macht es anders; umgedreht wird genau einmal, beim Einlesen, mit dem Haken „umdrehen“ in der Quellenzeile."
K05 = "Steht der Haken falsch, regelt die Bremse exakt verkehrt herum: Sie gibt frei, wenn eingespeist wird, und drosselt, wenn bezogen wird. Der Reiter <i>Test</i>, Knopf „Messwerte lesen“, zeigt den Wert so, wie ihn die Regelung sieht — bei Sonnenschein und laufender Anlage muss dort eine negative Zahl stehen."
K06 = "Was in welcher Reihenfolge geschieht"
K07 = "Bei jedem Durchlauf, voreingestellt alle fünf Sekunden:"
K08 = "Zählerwert lesen. Ist er zu alt oder unglaubhaft, geht es sofort in den Notbetrieb — dazu weiter unten mehr."
K09 = "Überschuss ausrechnen: alles, was über der erlaubten Einspeisung hinausgeht."
K10 = "So viel wie möglich in den Speicher schieben. Das kostet keinen Ertrag und ist deshalb immer der erste Griff."
K11 = "Erst was übrig bleibt, wird abgeregelt — in Schritten, damit die Anlage nicht pumpt."
K12 = "Es werden keine Register erfunden"
K13 = "Welche Adresse ein Wechselrichter für einen Fernsollwert annimmt, weiß der Hersteller und sonst niemand. Ein geratenes Modbus-Register schreibt im besten Fall ins Leere und im schlechtesten in eine Werkseinstellung, die nachher niemand mehr findet. Deshalb steht in diesem Plugin keine einzige eingebaute Geräteliste."
K14 = "Stattdessen tragen Sie ein, was Ihr Gerät versteht, und setzen einen Platzhalter dorthin, wo der Wert hingehört: <span class='sm-mono'>{W}</span> für Watt, <span class='sm-mono'>{KW}</span> für Kilowatt mit drei Nachkommastellen, <span class='sm-mono'>{PROZENT}</span> für den Anteil an der Spitzenleistung."
K15 = "Drei Beispiele, wie sie in der Praxis aussehen: ein MQTT-Thema <span class='sm-mono'>ahoy/limit/set</span> mit dem Inhalt <span class='sm-mono'>{W}</span>; ein HTTP-GET auf <span class='sm-mono'>http://192.168.1.51/api/limit?value={PROZENT}</span>; ein HTTP-POST mit dem Inhalt <span class='sm-mono'>{&quot;limit&quot;:{W}}</span>. Der Reiter <i>Test</i> zeigt im Trockenlauf die fertige Zeichenkette, Zeichen für Zeichen — genau die geht im Betrieb hinaus."
K16 = "Mehrere Wechselrichter"
K17 = "Die Gesamtgrenze wird im Verhältnis der eingetragenen Anteile aufgeteilt; stehen überall Nullen, wird gleichmäßig geteilt. Eine eingetragene Spitzenleistung begrenzt, was ein Gerät bekommen kann."
K18 = "Wird ein Gerät durch seine Spitze gedeckelt, wandert der Rest zu den anderen — so lange, bis nichts mehr übrig ist oder niemand mehr Luft hat. Ohne diese Runden summierten sich die gestellten Grenzen auf weniger als die erlaubte, und die Anlage bliebe dauerhaft zu scharf abgeregelt, ohne dass irgendwo ein Fehler stünde."
K19 = "Der Notbetrieb"
K20 = "Kommt vom Zähler nichts mehr, heißt das <b>nicht</b> „alles in Ordnung“. Wer bei ausgefallenem Zähler weiterregelt, regelt auf eine Erinnerung. Nach der eingestellten Zeit fährt die Anlage deshalb auf den Notwert herunter und der Speicher auf volle Ladeleistung."
K21 = "Der Notwert darf die Grenze nur senken, nie anheben — eine bereits bestehende Drosselung bleibt also bestehen. Die Zeit sollte mindestens drei Prüftakte betragen, sonst löst eine einzige verlorene Nachricht schon Notbetrieb aus."
K22 = "Quittung ist nicht Wirkung"
K23 = "Der unangenehmste Fall dieses Plugins ist ein Wechselrichter, der den Sollwert mit HTTP 200 quittiert und dann ignoriert: alles meldet Erfolg, und die Auflage ist trotzdem verletzt. Deshalb wird nach der eingestellten Wartezeit am Zähler nachgesehen, ob die Einspeisung tatsächlich gefallen ist."
K24 = "Ist sie das nicht, erscheint oben eine Warnung, und der Wert <span class='sm-mono'>WIRKUNG</span> geht auf −1. Das ist fast immer eine falsche Adresse, eine falsche Einheit oder ein Gerät, das den Fernsollwert nur in einem bestimmten Betriebsmodus annimmt."
K25 = "Der Endpunkt schaltet keinen Sollwert"
K26 = "Aus Loxone lässt sich die Regelung <b>ein- und ausschalten</b> — mehr nicht. Ein Sollwert von außen ist bewusst nicht vorgesehen: Das Wortzeichen steht offen in der Adresse und ist im Netz sichtbar; wer damit die Grenze setzen könnte, könnte die Anlage abschalten."
K27 = "Der Schalter dagegen ist nützlich und im schlimmsten denkbaren Fall harmlos: Er <i>gibt die Anlage frei</i>, er drosselt sie nicht. Praktisch etwa, um bei einem Netzausfall oder einem Ersatzstrombetrieb die Bremse aus dem Baustein heraus zu lösen."
K28 = "Wenn nichts geregelt wird"
K29 = "Der Reihe nach: Läuft der Dienst? Die Kachel oben links sagt es. Ist die <b>Regelung</b> eingeschaltet — das ist etwas anderes als der Dienst? Gibt es Mängel? Der Reiter <i>Test</i>, Knopf „Einstellung prüfen“, zählt sie auf; solange dort etwas steht, lässt sich die Regelung gar nicht erst einschalten."
K30 = "Kommen Messwerte an? „Messwerte lesen“ zeigt es. Steht dort <span class='sm-mono'>nichts_empfangen</span>, hört das Plugin auf einem Thema, auf dem niemand sendet — oder <span class='sm-mono'>mosquitto_sub</span> fehlt, was der Reiter <i>MQTT prüfen</i> beantwortet."
K31 = "Und schließlich: Beim Ausschalten der Regelung wird die Anlage <b>einmal freigegeben</b>. Bleibt sie trotzdem gedrosselt, hat die Freigabe das Gerät nicht erreicht — dann steht im Protokoll, an welchem Stellglied es lag."
