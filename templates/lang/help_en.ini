; Help texts, English. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.

[HILFE]
K01 = "Einspeisebremse (export brake)"
K02 = "Keeps the export to the grid at the permitted value — zero for a zero-export rule, 70 percent of the module power for a 70-percent rule. It measures at the grid meter, works out how much is going out too much, and passes a limit to the inverters. Before that it pushes whatever it can into the battery — because stored electricity costs no yield, curtailed electricity does."
K03 = "The sign — the most common mistake"
K04 = "Throughout this plugin: <b>plus is import from the grid, minus is export</b>. Every meter does it differently; the inversion happens exactly once, when reading, with the “invert” box in the source row."
K05 = "If that box is wrong, the brake controls exactly backwards: it releases when exporting and curtails when importing. The <i>Test</i> tab, button “Read measurements”, shows the value as the control sees it — with sun and the plant running there must be a negative number."
K06 = "What happens in which order"
K07 = "On every pass, by default every five seconds:"
K08 = "Read the meter. If the value is too old or implausible, emergency mode follows immediately — more on that below."
K09 = "Work out the surplus: everything above the permitted export."
K10 = "Push as much as possible into the battery. That costs no yield and is therefore always the first move."
K11 = "Only what is left over is curtailed — in steps, so the plant does not oscillate."
K12 = "No registers are invented"
K13 = "Which address an inverter accepts for a remote setpoint is known to the manufacturer and to nobody else. A guessed Modbus register writes into the void at best and into a factory setting nobody can find afterwards at worst. That is why this plugin contains no built-in device list at all."
K14 = "Instead you enter what your device understands and put a placeholder where the value belongs: <span class='sm-mono'>{W}</span> for watts, <span class='sm-mono'>{KW}</span> for kilowatts with three decimals, <span class='sm-mono'>{PROZENT}</span> for the share of the peak power."
K15 = "Three examples as they look in practice: an MQTT topic <span class='sm-mono'>ahoy/limit/set</span> with body <span class='sm-mono'>{W}</span>; an HTTP GET to <span class='sm-mono'>http://192.0.2.50/api/limit?value={PROZENT}</span>; an HTTP POST with body <span class='sm-mono'>{&quot;limit&quot;:{W}}</span>. The dry run in the <i>Test</i> tab shows the finished string, character by character — that exact string goes out in operation."
K16 = "Several inverters"
K17 = "The total limit is split in proportion to the configured shares; if all are zero it is split evenly. A configured peak power caps what a device can receive."
K18 = "If a device is capped by its peak, the remainder moves to the others — until nothing is left or nobody has headroom. Without those rounds the limits sent would add up to less than the permitted one, and the plant would stay permanently over-curtailed without any error appearing anywhere."
K19 = "Emergency mode"
K20 = "If nothing arrives from the meter, that does <b>not</b> mean “all is well”. Controlling on with a failed meter means controlling on a memory. After the configured time the plant is therefore brought down to the emergency value. The charging setpoint stays where it was — without a meter nobody knows whether charging would be right just then, and a raised setpoint blocked the return to normal control up to 0.9.4."
K21 = "The emergency value may only lower the limit, never raise it — an existing curtailment stays in place. The time should be at least three control cycles, otherwise a single lost message already triggers emergency mode."
K22 = "A receipt is not an effect"
K23 = "The most unpleasant case in this plugin is an inverter that acknowledges the setpoint with HTTP 200 and then ignores it: everything reports success, and the rule is broken all the same. That is why, after the configured waiting time, the meter is consulted on whether the export actually fell."
K24 = "If it did not, a warning appears at the top and the value <span class='sm-mono'>WIRKUNG</span> goes to −1. That is almost always a wrong address, a wrong unit, or a device that accepts a remote setpoint only in a particular operating mode."
K25 = "The endpoint sets no setpoint"
K26 = "From Loxone the control can be switched <b>on and off</b> — nothing more. A setpoint from outside is deliberately not provided: the token sits openly in the address and is visible on the network; whoever could set the limit with it could shut the plant down."
K27 = "The switch, by contrast, is useful and harmless in the worst imaginable case: it <i>releases</i> the plant, it does not curtail it. Handy for releasing the brake from a Loxone block during a grid failure or backup-power operation."
K28 = "When nothing is being controlled"
K29 = "In order: is the service running? The tile at the top left says so. Is the <b>control</b> switched on — which is a different thing from the service? Are there defects? The <i>Test</i> tab, button “Check the configuration”, lists them; while anything is listed there, the control cannot be switched on at all."
K30 = "Are measurements arriving? “Read measurements” shows it. If it says <span class='sm-mono'>nichts_empfangen</span>, the plugin is listening to a topic nobody publishes to — or <span class='sm-mono'>mosquitto_sub</span> is missing, which “Check MQTT” answers."
K31 = "And finally: when the control is switched off the plant is <b>released once</b>. If it stays curtailed anyway, the release did not reach the device — the log then says which actuator it was."
