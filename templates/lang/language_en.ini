HILFE = "<b>Kind:</b> “MQTT” listens to a topic, “HTTP” polls an address. <b>Path in the JSON:</b> leave empty if the message is just a number; otherwise the way to the value, for example <span class='sm-mono'>data.power</span> or <span class='sm-mono'>emeters.0.power</span>. <b>Factor:</b> for meters that report kW — then 1000. <b>Invert:</b> throughout this plugin <b>plus = import, minus = export</b>. If your meter reports it the other way round, tick this box; that is the most common reason for a brake that controls exactly backwards. <b>Generation 2</b> is for a second PV system: it is <b>added</b> to the first one (the backup meter replaces, this source adds). <b>Note:</b> if either of the two configured values fails, the whole generation counts as unknown — a partial sum would be too small and would curtail the plant too hard."

