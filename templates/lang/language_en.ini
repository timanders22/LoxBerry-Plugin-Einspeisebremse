MAENGEL_KOPF = "While this is open, the control cannot be switched on:"
QUELLEN_ERKLAERUNG = "The grid meter is the only mandatory entry — it is the measure of all things. Generation, state of charge and charge power are optional; without them the brake still controls correctly, but it can no longer push the surplus into the battery first."
REGELGROESSEN_HILFE = "<b>Dead band:</b> smaller deviations are ignored, otherwise the control adjusts every few seconds. <b>Step down/up:</b> curtailing may jump — that is the direction that keeps the rule. Releasing goes in small steps, otherwise the control oscillates: every release creates new export, which is curtailed again on the next pass. <b>Emergency after:</b> how old the meter value may be before the emergency value is applied; at least three control cycles. <b>Check effect after:</b> how much time the device gets before the meter is consulted on whether the command did anything at all."
REGELUNG_ERKLAERUNG = "The defaults suit zero export on a domestic installation. If you run a 70-percent rule, enter 70 percent of the module power under “permitted export”."
SCHALTER_ERKLAERUNG = "While the control is off, values are measured and displayed but <b>nothing is sent</b>. That way the whole configuration can be checked calmly — the dry run in the <i>Test</i> tab shows what the control would do. When switching off, the plant is <b>released once</b>; otherwise it would stay at the last limit sent, and the missing yield would only be noticed weeks later."
SICH_ABGELEHNT = "The file was <b>not</b> accepted — nothing has been changed:"
SICH_ERKLAERUNG = "For <b>moving to a second LoxBerry</b>: the file contains all settings of this plugin and can be restored there."
SICH_FREMD = "Unknown setting in the file: %s"
SICH_KEINE_DATEI = "No file was selected, or the upload failed."
SICH_KEIN_JSON = "The file is not a valid backup of this plugin."
SICH_LEER = "The file contains no known setting."
SICH_SCHREIBFEHLER = "The settings could not be written."
SICH_UEBERNOMMEN = "Settings restored: %d values taken over."
SICH_WARNUNG = "<b>The file contains your credentials.</b> Without them all fields would look right after restoring and the plugin still would not reach the installation. Treat the file like a password: do not post it in a forum and do not attach it to a bug report."
SICH_ZU_GROSS = "The file is larger than allowed — a backup of this plugin is a few kilobytes."
SPEICHER_STELLER_ERKLAERUNG = "Optional, but effective: without a path here the charging setpoint is just a number on the screen. If nothing is entered, the control checks the measured charging power to see whether the battery takes the surplus at all — and curtails if it does not. Same placeholders as for the inverters."
STELLER_ERKLAERUNG = "This is where you enter what your device understands — <b>no guessed registers</b>. Which address an inverter accepts is known to the manufacturer and to nobody else; an invented Modbus register writes into the void at best and into a factory setting at worst. So you enter address and body yourself and put a placeholder where the value belongs."
STUFEN_ERKLAERUNG = "From Loxone you can <b>select</b> which of the three stages applies — never set a value. That is the whole difference: the token is visible in the address, and whoever could set a number there could shut the plant down. A stage leads at worst to what you entered here yourself. If you only need one stage, leave 1 and 2 at 0 and ignore them. Currently selected: <b>stage %1$d</b>, that is %2$d W."

