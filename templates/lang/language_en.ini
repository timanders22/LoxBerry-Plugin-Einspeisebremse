ERZEUGUNG_WEITERE_OHNE_ADRESSE = "A further generation source has a type but no address. It is <b>added</b>, not substituted — and since a sum only counts when every summand is present, the <b>entire</b> generation measurement fails with it. That is worse than having no further source."
ERZEUGUNG_WEITERE_OHNE_ERSTE = "A further generation source is configured but no first one. That works, but is probably not what you meant — enter the systems in order."
ERZEUGUNG_DOPPELT = "Two generation sources point at the <b>same</b> device: same type, same address, same path. That counts one inverter twice — generation would appear twice as large, the limit would be set too high and the brake would curtail too little. A silent error that only shows up at the meter."
KEIN_ZAEHLER = "No source is configured for the grid meter. Without a meter there is nothing to control — the export would be unknown."
ZAEHLER_OHNE_ADRESSE = "A kind is selected for the grid meter but no address is given."
KEIN_STELLER = "No actuator is configured. The control could calculate but not set anything."
STELLER_OHNE_ADRESSE = "An actuator has a name but no address."
OHNE_PLATZHALTER = "An actuator contains no placeholder ({W}, {KW} or {PROZENT}). It would send the same command for every setpoint."
PROZENT_OHNE_SPITZE = "An actuator works in percent but has no peak power — no percentage can be formed from that."
SUNSPEC_FORM = "A SunSpec address does not match the pattern <span class='sm-mono'>IP[:port]/unit[/base[/revert_s]]</span>."
SUNSPEC_OHNE_SPITZE = "A SunSpec actuator has no peak power. It sets a percentage of rated power — without that figure none can be formed."
SUNSPEC_OHNE_RUECKFALL = "A SunSpec actuator has its revert time set to 0. The inverter then keeps <b>no</b> timeout: if the LoxBerry dies, the plant stays throttled until somebody notices. That may be what you want — but not by accident."
SUNSPEC_RUECKFALL_ZU_KURZ = "On a SunSpec actuator the revert time is shorter than three cycles. Refreshing happens at most once per cycle; in between the inverter would drop the throttle by itself, and the plant would jump between throttled and full."
SUNSPEC_UNTER_ZEHN = "The lower throttling limit is below ten percent of a SunSpec actuator’s rated power. <b>Measured on 19 Aug 2026</b> (Fronius Symo 8.2-3-M, firmware 0.3.30.2): down to 0.09 % <i>no</i> forced standby occurred — the device throttled cleanly and dropped the mode by itself after the timeout. So the manual’s warning does not apply to every firmware. Two reasons remain nonetheless: the manual calls the standby risk explicitly <i>firmware-dependent</i>, and your device may run a different one; and below roughly half a percent of rated power the device stops following the setpoint anyway (measured: setpoint 7 W, held 39 W). A lower limit below that is ineffective, not strict."
SUNSPEC_NOTWERT_ZU_TIEF = "The emergency value is below ten percent of a SunSpec actuator’s rated power. <b>The emergency path bypasses the lower limit</b> — if the meter fails, exactly this value is set, not the lower limit. The main reason is not standby (which did <i>not</i> occur down to 0.09 % on 19 Aug 2026) but the effect at the meter: on a hybrid the house draws every watt the inverter may no longer deliver from the grid. Measured: 77 W of curtailment produced 78 W of grid import. An emergency value of 0 pushes the <b>entire</b> household load onto the grid when the meter fails — and keeps it there until somebody notices. If you would rather not feed in at all than feed in uncontrolled, you may set it that way — just not by accident."
SPEICHER_SUNSPEC = "The battery is set to the SunSpec path. That path drives model 123, the inverter throttle — the battery sits on model 124, which is not built here. Configured this way, charging would trigger curtailment."
SPEICHER_OHNE_LEISTUNG = "“Fill the battery first” is switched on, but the maximum charge power is 0. The battery would never take anything."
SPEICHER_OHNE_MESSUNG = "“Fill the battery first” is switched on, but no source for the charging power is configured. Without it there is no way to tell whether the battery actually takes the surplus — up to 0.9.4 it counted as able to absorb without any check, and the plant kept feeding in while the display reported the surplus going to the battery."
SPEICHER_OHNE_ADRESSE = "A path is selected for the battery but no address is given."
SPEICHER_OHNE_PLATZHALTER = "The battery has no placeholder, neither in the address nor in the body. The same command would be sent for every charging setpoint."
SPEICHER_PROZENT_OHNE_SPITZE = "The battery uses percent but has no peak power — no percentage can be calculated."
RAMPE_VERDREHT = "The upward step is larger than the downward one. That is almost always the wrong way round: curtailing should be fast, releasing slow."
NOTWERT_ZU_HOCH = "The emergency value is above the permitted export. In an emergency the plant would export more than allowed — which is precisely the case the emergency value exists for."
NOTFALL_ZU_KURZ = "The emergency triggers after less than three control cycles. A single lost message would already cause emergency mode."

