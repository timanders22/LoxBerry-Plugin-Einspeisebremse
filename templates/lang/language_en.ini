[LOX]
ADRESSE_IP_UNBEKANNT = "the LoxBerry's network address"
ADRESSE_IP = "the address <span class='sm-mono'>%s</span>"
ADRESSE_WARNUNG = "<b>Careful:</b> you opened this page as <span class='sm-mono'>%1$s</span>. That exact name goes into the template — and in the Miniserver it points at <i>the Miniserver itself</i>, not at the LoxBerry. Enter %2$s in Loxone Config instead, or open this page under the LoxBerry's network address and download the template again."
Z_STUFE = "select target stage (0, 1 or 2)"
H_SCHRITTE = "Step by step"
S1 = "<b>1. Choose the path.</b> The Miniserver fetches the values from the address below &mdash; that is this plugin's normal path and needs no MQTT. If you also want the values in the broker, the topics are in the <i>MQTT</i> tab; the subscription without which nothing arrives at the Miniserver is there too."
S2 = "<b>2. Check the address.</b> The address in the template is derived from the host name you used to open <i>this very page</i>. If you open the interface via <span class='sm-mono'>localhost</span>, that is what it says &mdash; and in the Miniserver that points at itself. Check the address before importing the template; when in doubt enter the LoxBerry's IP address."
S3 = "<b>3. Create the virtual inputs.</b> Download the template and import it in Loxone Config under <b>Virtual inputs &rarr; import template</b>. <b>Careful:</b> Loxone Config <b>creates new objects and overwrites nothing</b> on import. Importing twice means duplicate objects &mdash; delete the old ones first."
S4 = "<b>4. Send commands.</b> A virtual output with the two addresses from the table above switches the control on and off. Deliberately nothing more: the switch releases the plant, it does not curtail it."
S5 = "<b>5. Failure detection.</b> Virtual inputs keep their last value &mdash; if the LoxBerry fails, everything looks normal in the app. That is why the plugin supplies two age values: <span class='sm-mono'>EB_ALTER</span> for the service cycle and <span class='sm-mono'>EB_MESSALTER</span> for the meter reading. Both keep rising when nothing arrives."
S6 = "<b>6. Rebuild the blocks.</b> Work through the table below from top to bottom. Loxone Config lists the blocks in the block search (F5)."
S7 = "<b>7. Cross-check.</b> Switch the control on in the interface and open the live view in Loxone Config: <span class='sm-mono'>EB_EIN</span> must jump to 1 and <span class='sm-mono'>EB_ALTER</span> must fall back every cycle. If a value stays put, the address is wrong &mdash; not the block."
H_BAUSTEINE = "The blocks, one per row"
BAUSTEINE = "<table class='sm-tbl'><tr><th>#</th><th>Block (type)</th><th>Name (suggestion)</th><th>Parameters</th><th>Connect inputs to</th></tr><tr><td>1</td><td>Memory flag</td><td>Brake running</td><td>&mdash;</td><td><span class='sm-mono'>EB_EIN</span></td></tr><tr><td>2</td><td>Formula</td><td>Feed-in</td><td><span class='sm-mono'>-min(0;I1)</span></td><td><span class='sm-mono'>EB_NETZ</span></td></tr><tr><td>3</td><td>Analogue comparator</td><td>Limit exceeded</td><td>threshold = permitted feed-in + 200 W, on-delay 120 s</td><td>#2</td></tr><tr><td>4</td><td>Memory flag</td><td>Emergency mode</td><td>&mdash;</td><td><span class='sm-mono'>EB_NOTFALL</span></td></tr><tr><td>5</td><td>Analogue comparator</td><td>No effect</td><td>less than 0</td><td><span class='sm-mono'>EB_WIRKUNG</span></td></tr><tr><td>6</td><td>Analogue comparator</td><td>Meter failed</td><td>greater than three times the cycle time</td><td><span class='sm-mono'>EB_MESSALTER</span></td></tr><tr><td>7</td><td>Analogue comparator</td><td>Service stopped</td><td>greater than 120 s</td><td><span class='sm-mono'>EB_ALTER</span></td></tr><tr><td>8</td><td>OR</td><td>Collective fault feed-in brake</td><td>&mdash;</td><td>#3, #4, #5, #6, #7</td></tr><tr><td>9</td><td>Notification block</td><td>Feed-in brake message</td><td>subject and text free</td><td>#8 &mdash; and <b>only</b> #8</td></tr><tr><td>10</td><td>Virtual output</td><td>Switch the brake</td><td>address see above, command on ON and on OFF</td><td>a switch or a condition</td></tr><tr><td>11</td><td>Statistics (optional)</td><td>Limit actually set</td><td>&mdash;</td><td><span class='sm-mono'>EB_GESTELLT</span></td></tr></table>"
BAUSTEINE_ERL = "<b>On #3:</b> The on-delay is not a nicety. Without it every gap in the clouds reports a breach, and after the third message nobody looks any more. <b>On #6 and #7:</b> Set the thresholds well above the polling interval, otherwise a single missed cycle triggers them. <b>On #9:</b> The notification block only sends on a change from off to on. Never wire several sources straight into its input &mdash; combine them through the OR first, otherwise one permanently active source swallows all the others."
