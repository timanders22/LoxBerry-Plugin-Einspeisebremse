[VORLAGE]
EASTRON_HINWEIS = "Sets <b>only the grid meter</b> to register 52, function code 4, as a 32-bit float. Established from the Loxone template <span class='sm-mono'>MB_Eastron SDM630-TCP.xml</span>, channel “027 – Total system power”: register 52 with function code 4, and because Loxone divides by 1000 to display kW, the register delivers <b>watts</b>. <b>Please verify:</b> whether the meter carries the sign is not stated there. Behind a gateway the unit address is often not 1 — the <i>Test</i> tab shows what arrives."
EASTRON = "Eastron SDM630, via Modbus TCP"
ANGEWENDET_ERSATZ = "The template's grid meter was placed on the <b>backup meter</b>. All other fields were left untouched. Please review and then save."
OHNE_NETZ = "This template contains no grid meter — it cannot be applied to the backup meter. Nothing was changed."
Z_ERSATZ = "the backup grid meter only"
Z_VORLAGE = "the fields the template provides"
ZIEL = "apply to"
HAND = "Enter by hand"
HAND_HINWEIS = "Nothing is pre-filled. All fields stay as they are."
SMARTMETER = "Smartmeter Classic (LoxBerry plugin), via MQTT"
SMARTMETER_HINWEIS = "Sets <b>only the grid meter</b> to <span class='sm-mono'>&lt;prefix&gt;/Total_Power_OBIS_16.7.0</span> — the instantaneous total active power. <b>Please verify:</b> whether this meter carries the sign is not established. During sunshine, check the <i>Test</i> tab under “Read measurements”: if it shows a <b>negative</b> number while feeding in, all is well. If it stays at 0 or positive, your meter keeps import and export separate — then this topic is not suitable."
FRONIUS = "Fronius Symo Hybrid (Solar API), via HTTP"
FRONIUS_HINWEIS = "Sets <b>all four</b> sources to <span class='sm-mono'>/solar_api/v1/GetPowerFlowRealtimeData.fcgi</span>. Measured on a Symo Hybrid on 19 Aug 2026: <span class='sm-mono'>P_Grid</span> already follows the house rule (plus = import) and is not inverted; <span class='sm-mono'>P_Akku</span> is positive while <i>discharging</i> and is therefore inverted. The state of charge comes from inverter 1. With several batteries this applies to the one the Solar API reports."
FRONIUS_MODBUS = "Fronius Symo Hybrid, via Modbus TCP (measured)"
FRONIUS_MODBUS_HINWEIS = "Puts <b>grid, generation and state of charge</b> on Modbus TCP and only the <b>charging power</b> on the Solar API — SunSpec model 124 carries no register for charge or discharge power. All addresses were <b>measured</b> on a Symo Hybrid on 19 Aug 2026. The <b>meter</b> has unit id <span class='sm-mono'>240</span>, not 1: it hangs off the Datamanager and is reached through its gateway; its sign matches <span class='sm-mono'>P_Grid</span> (plus = import) and is <i>not</i> inverted. <b>Important about „generation”:</b> register 40091 is the <b>inverter AC output</b>, not PV generation — on a hybrid it includes battery discharge. At night it shows several hundred watts with the sun gone; that is not a fault, that is the battery. It is still the right value for this plugin, because the computed limit acts through <span class='sm-mono'>WMaxLimPct</span> on exactly that output. If you want pure PV power instead, use the Solar API template. <b>Note:</b> the addresses apply to the „float” setting (model 113); with „int+SF” everything shifts by ten registers. Check in the Test tab after applying. <b>Two inverters?</b> Afterwards also apply the template „Fronius, second inverter” — it sets only <span class='sm-mono'>Generation 2</span>, and both generation values are added."
FRONIUS_MODBUS_ZWEITER = "Fronius, second inverter (Generation 2 only)"
FRONIUS_MODBUS_ZWEITER_HINWEIS = "For a <b>second</b> PV system. Sets <i>only</i> the <b>Generation 2</b> source — everything else is left untouched. Apply the template for the first inverter first, then this one. Both generation values are <b>added</b>. <b>Why this asks for more than an IP:</b> with a second device <i>two</i> things differ — the Datamanager address <b>and</b> the unit id behind it. Measured on 19 Aug 2026: the Hybrid sits on <span class='sm-mono'>192.168.178.31</span> at <span class='sm-mono'>1</span>, the Symo 8.2 on <span class='sm-mono'>192.168.178.30</span> at <span class='sm-mono'>2</span>. Nothing is guessed here. <b>How to find the unit id:</b> if the Datamanager answers with <i>Modbus exception 11</i>, the port is right and the unit id is wrong — try 1 through 10. <b>Note:</b> register 40091 is the inverter AC output, not PV power; on a second hybrid it likewise includes the battery. And if <b>either</b> generation source fails, the whole generation counts as unknown — a partial sum would be too small and would curtail too hard. <b>A third inverter?</b> Use the <span class='sm-mono'>Generation 3</span> field — enter it by hand following the same pattern <span class='sm-mono'>ip:port/unit/40091/float32/3</span>. If two fields point at the same device the defects list says so: that would count one inverter twice."
