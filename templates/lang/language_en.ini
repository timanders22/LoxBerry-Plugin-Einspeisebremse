[MANGEL]
MODBUS_FORM = "A Modbus address does not match the pattern <span class='sm-mono'>IP[:port]/unit/register/type[/function code]</span>, for example <span class='sm-mono'>192.168.178.40:502/1/52/float32/4</span>. It is not bent into shape — a half-understood register value looks like a measurement."
