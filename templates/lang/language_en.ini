[STELL]
STILL_HILFE = "A stopped actuator keeps its settings but is no longer given a value and disappears from Loxone. Careful: it stays at the limit last set — so switch the control off briefly before stopping it, so that it gets released."
SUNSPEC_HILFE = "<b>Modbus TCP / SunSpec:</b> this path needs <i>no</i> placeholder — it derives the percentage itself from the limit and the <b>peak power</b>, which must therefore be filled in. Address: <span class='sm-mono'>IP[:port]/unit[/base[/revert_s]]</span>, typically <span class='sm-mono'>192.168.178.31:502/1/40000/120</span>. <b>Base</b> is the register holding the <span class='sm-mono'>SunS</span> marker (40000 on the Fronius Datamanager); the model chain is walked from there until model 123 appears — it does <i>not</i> sit at a fixed address. <b>Revert</b> is the timeout in seconds kept by the inverter itself: after it expires the device drops the throttle on its own, should the brake fall silent. The plugin refreshes before that. Two things must be right in the Fronius web interface, otherwise the device acknowledges politely and does nothing: <i>inverter control via Modbus</i> must be enabled, and if <i>restrict control</i> is active the LoxBerry’s IP must be listed there. Whether throttling actually happens is then told solely by the effect check at the meter."
