L_INHALT = "Body (with placeholder)"
HILFE = "<b>Placeholders:</b> <span class='sm-mono'>{W}</span> the limit in watts, <span class='sm-mono'>{KW}</span> the same in kilowatts with three decimals, <span class='sm-mono'>{PROZENT}</span> the share of the peak power from 0 to 100. It may sit in the address or in the body. Examples: MQTT topic <span class='sm-mono'>inverter/limit/set</span> with body <span class='sm-mono'>{W}</span>; or HTTP GET <span class='sm-mono'>http://192.168.1.50/api/limit?value={PROZENT}</span>; or HTTP POST to an address with body <span class='sm-mono'>{&quot;limit&quot;:{W}}</span>. <b>Share:</b> with several devices the total limit is split in proportion to the shares; if all are zero it is split evenly. <b>Peak power</b> is needed for “percent” and also caps what this device is allotted."
