[AUTHOR]
# Diese beiden Felder sind die KENNUNG des Plugins, kein Urhebervermerk.
# LoxBerry bildet daraus zusammen mit [PLUGIN] NAME die Kennzahl, unter der
# es Installation und Updates fuehrt. Sie duerfen spaeter NIE geaendert
# werden - LoxBerry hielte das Plugin sonst fuer ein anderes, und jedes
# Update schluege fehl. Deshalb steht hier ein Projektname und eine
# noreply-Adresse und keine Person.
NAME=Einspeisebremse Plugin Authors
EMAIL=einspeisebremse@users.noreply.github.com

[PLUGIN]
VERSION=0.9.14
NAME=einspeisebremse
FOLDER=einspeisebremse
TITLE=Einspeisebremse

[AUTOUPDATE]
# Bewusst AUS - und das ist inzwischen eine ENTSCHEIDUNG, keine Wartestellung
# mehr. Am 18.08.2026 gemessen: das Repository steht, es gibt Releases zu
# v0.9.1, v0.9.2 und v0.9.3, und die Adresse unter ARCHIVEURL antwortet mit
# HTTP 200. Die Bedingung, unter der hier frueher "spaeter auf true" stand,
# ist damit erfuellt. Wer umstellt, laesst ab dann jede Anlage selbsttaetig
# Fassungen nachziehen - das gehoert bewusst entschieden und nicht nebenbei.
#
# Bei jedem Release: VERSION hier UND in release.cfg erhoehen, beide
# Adressen dort auf den neuen Tag setzen, das Release mit genau diesem Tag
# anlegen - und danach nachpruefen, dass der Tag wirklich existiert.
#
# Beide Adressen zeigen auf den Zweig master des EIGENEN Repositoriums - nie
# auf ein fremdes. LoxBerry vergleicht Fassungen als Zahl, und ein fremdes
# 2021.05.14 waere groesser als 0.9.1; daraus wuerde ein stilles Downgrade
# auf ein voellig anderes Plugin (Hausregel, belegt am Docker-Plugin).
#
# EIN seit 0.9.6 - eine Entscheidung des Betreibers, kein Vorgabewert.
# Voraussetzung war und ist: das Repository steht, es gibt Releases mit Tags
# in der Form vX.Y.Z, und die Adresse unter ARCHIVEURL antwortet.
#
# Was das verlangt: ab jetzt ist JEDES Release vollstaendig oder es schadet.
# Ein Tag ohne Release, eine release.cfg mit einer Nummer, die es als Tag
# nicht gibt, oder eine hoehere Nummer im Zweig master als im Tag - all das
# geht ab jetzt an fremde Anlagen, nicht mehr nur an die eigene. Und ein
# Fehler, der frueher beim naechsten Blick auffiel, ist dann schon verteilt.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Einspeisebremse/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Einspeisebremse/master/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Mindestens 3.0.0: das Plugin liest config/system/general.json. Mit 2.0
# liesse es sich installieren und liefe dann nicht.
LB_MINIMUM=3.0.0
# Keine Obergrenze. plugininstall.pl ruft bei Ueberschreitung &fail() - die
# Installation wird abgebrochen, nicht nur gewarnt.
LB_MAXIMUM=false
# SYSTEM.ARCHITECTURE wird von plugininstall.pl gelesen und danach nie
# benutzt. Eine Angabe verhindert also nichts, waere aber eine unwahre
# Aussage - das Plugin ist reines PHP und laeuft ueberall.
ARCHITECTURE=false
